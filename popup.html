<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepShield</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
    
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --safe-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --fake-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    }

    body { 
      font-family: 'Outfit', sans-serif; 
      padding: 0;
      margin: 0;
      width: 350px; 
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(45deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin-left: 8px;
    }

    .container {
      padding: 15px;
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 15px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #result {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Loader Animation */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Media Block Glassmorphism */
    .media-block { 
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px; 
      padding: 12px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .media-block:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    img, video { 
      border-radius: 8px; 
      width: 100%;
      max-height: 180px; 
      object-fit: cover;
      display: block; 
      margin-bottom: 12px;
      background-color: #000;
    }

    /* Result Tags */
    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .safe-badge { background: var(--safe-gradient); color: #fff; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    .fake-badge { background: var(--fake-gradient); color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

    .confidence {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .confidence-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    
    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s ease-out;
    }

    .no-media {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <div class="logo">DeepShield</div>
  </header>
  
  <div class="container">
    <h3>Scan Results</h3>
    <div id="result">
      <div class="loader-container">
        <div class="spinner"></div>
        <div>Initializing Systems...</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
